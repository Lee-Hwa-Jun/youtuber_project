<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수면 주파수 영상 · 소스 생성기</title>
<style>
:root{
  --bg:#0c0f14; --panel:#141922; --panel2:#1b222d; --panel3:#232c38;
  --line:#2a3441; --line2:#3a4656;
  --text:#e8eef6; --muted:#93a2b4; --dim:#69788a;
  --accent:#8b7cf6; --accent-ink:#fff;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --radius:13px; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:1240px;margin:0 auto;padding:0 18px 60px;padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:15px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(139,124,246,.22)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--dim);letter-spacing:0}
.tabs{display:flex;gap:4px;padding:10px 0 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:9px 14px;cursor:pointer;font-weight:700;font-size:13.5px;border-radius:8px 8px 0 0}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:.14s;font-size:13px;font-weight:600}
.btn:hover{background:var(--panel3);border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:#ff7b7b;border-color:var(--line)}
.btn.danger:hover{background:rgba(208,59,59,.14);border-color:var(--critical)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:11px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input,select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;outline:none}
.input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,124,246,.18)}
label.f{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
label.f b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 12px;font-size:15px;letter-spacing:-.2px}
.card h3 .sub{font-weight:500;font-size:12px;color:var(--dim);margin-left:6px}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.tip{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.tip b{color:var(--text)} .tip.warn{border-left-color:var(--warning)} .tip.crit{border-left-color:var(--critical)}
.fields{display:flex;flex-direction:column;gap:12px}
fieldset{border:none;padding:0;margin:0;min-width:0}
fieldset:disabled{opacity:.55}
.divider{height:1px;background:var(--line);margin:14px 0}

/* 비주얼 */
.vis{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.preview{background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.preview canvas{display:block;width:100%;height:auto;background:#000}
.preview .ovl{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.14);color:#dfe7f2;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;backdrop-filter:blur(3px)}
.chip.rec{background:rgba(208,59,59,.85);border-color:transparent;color:#fff}
.chip.rec::before{content:"●";margin-right:5px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.pats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pat{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;transition:.13s;text-align:center}
.pat:hover{background:var(--panel3);border-color:var(--line2)}
.pat.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pat small{display:block;font-weight:500;font-size:10px;opacity:.75;margin-top:1px}
.pals{display:flex;gap:6px}
.pal{flex:1;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer;position:relative}
.pal.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.pal span{position:absolute;inset:auto 0 -17px 0;text-align:center;font-size:10px;color:var(--dim);font-weight:700}
.prog{height:8px;background:var(--panel3);border-radius:20px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .2s}
.prog.rec>i{background:var(--critical)}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--muted)}
.stat b{color:var(--text);font-variant-numeric:tabular-nums}

/* 음원 */
.aud{display:grid;grid-template-columns:1fr;gap:14px}
.freq-item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.freq-head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.freq-hz{font-size:22px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.freq-hz small{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:0;margin-left:3px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hzchip{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.hzchip:hover{background:var(--panel3);border-color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.b-gray{background:var(--panel3);color:var(--muted);border-color:var(--line)}
.b-accent{background:rgba(139,124,246,.16);color:#b9aeff;border-color:rgba(139,124,246,.42)}

.empty{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:26px 20px;text-align:center;background:var(--panel)}
.empty .ico{font-size:32px;line-height:1;margin-bottom:8px}
.empty h4{margin:0 0 6px;font-size:15px}
.empty p{margin:0 auto;max-width:560px;color:var(--muted);font-size:13px}
.empty ol{text-align:left;max-width:560px;margin:10px auto 0;color:var(--muted);font-size:13px;padding-left:20px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;font-weight:600;animation:tin .25s;max-width:90vw}
.toast.ok{border-color:var(--good)} .toast.err{border-color:var(--critical)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.banner{display:none;background:rgba(250,178,25,.12);border:1px solid rgba(250,178,25,.5);color:#ffd77a;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:700;margin-bottom:12px}
.banner.on{display:block}
.foot-note{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;text-align:center}
@media(max-width:900px){.vis{grid-template-columns:1fr}.g3{grid-template-columns:1fr}}
@media(max-width:700px){.app{padding:0 12px 50px}.pats{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span><span>소스 생성기<small>수면 주파수 영상용 · 영상(webm) + 음원(wav) 따로 뽑기</small></span></div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="vis">🌌 비주얼 생성기</button>
    <button class="tab" data-tab="aud">🎧 주파수 음원 생성기</button>
  </nav>
  <div class="banner" id="visBanner"></div>
  <main id="view"></main>
  <div class="foot-note">모든 파일은 브라우저 저장 대화상자로 내려받습니다 · 서버로 전송되는 것은 없습니다</div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================================
   소스 생성기 — 수면 주파수 영상용 영상(webm)·음원(wav) 소스
   ============================================================================ */
var TAU = Math.PI * 2;
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function on(s, ev, fn, r) { $$(s, r).forEach(function (n) { n.addEventListener(ev, fn); }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function toast(msg, kind) {
  var box = $('#toast'), t = document.createElement('div');
  t.className = 'toast ' + (kind || ''); t.textContent = msg; box.appendChild(t);
  setTimeout(function () { t.style.transition = '.3s'; t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 320); }, 3200);
}
function download(filename, blob) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function fmtSec(s) { s = Math.round(s); var m = Math.floor(s / 60), r = s % 60; return m ? m + '분' + (r ? ' ' + r + '초' : '') : r + '초'; }
function fmtBytes(b) { return b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB'; }
/* 시드 난수 (mulberry32) — 새로고침해도 같은 배치가 나오게 */
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ==========================================================================
   1. 비주얼 — 팔레트 · 프리셋 · 상태
   ========================================================================== */
var PALETTES = {
  indigo: { name: '남색',  bg: [10, 16, 40],  c: [[60, 80, 220], [110, 70, 200], [40, 120, 200]] },
  purple: { name: '보라',  bg: [22, 10, 36],  c: [[150, 70, 220], [220, 90, 190], [90, 60, 200]] },
  teal:   { name: '청록',  bg: [6, 24, 30],   c: [[40, 190, 180], [50, 130, 200], [90, 220, 170]] },
  amber:  { name: '앰버',  bg: [30, 18, 6],   c: [[240, 150, 50], [220, 90, 60], [255, 200, 90]] },
  mono:   { name: '모노',  bg: [14, 14, 16],  c: [[190, 195, 205], [130, 135, 145], [230, 232, 236]] }
};
/* 프리셋별 기본 주기(초). 모든 시간 항의 계수를 정수로 두어 이 주기에서 완벽히 루프합니다. */
var PATTERNS = {
  nebula:    { name: '네뷸라',     desc: '유영하는 성운',      base: 60 },
  stars:     { name: '별밭',       desc: '깜빡임 + 유성',      base: 90 },
  breath:    { name: '숨쉬는 원',  desc: '호흡 유도 리듬',     base: 60 },
  aurora:    { name: '오로라',     desc: '하단 빛 커튼',       base: 48 },
  smoke:     { name: '유체 연기',  desc: '흐르는 노이즈 결',   base: 60 },
  fireflies: { name: '반딧불',     desc: '부유하는 빛 입자',   base: 60 }
};
var RESOLUTIONS = { '1920x1080': [1920, 1080], '3840x2160': [3840, 2160], '1080x1920': [1080, 1920] };
var DURATIONS = [10, 30, 60, 180, 300];

var V = {   /* 비주얼 상태 */
  pattern: 'nebula', palette: 'indigo', speed: 1, density: 0.5, glow: 0.6, bgLevel: 0.25, breathSec: 6,
  res: '1920x1080', fps: 30, dur: 60, mbps: 16,
  recording: false, recStart: 0, recDur: 0, hiddenDuringRec: false, recorder: null, chunks: [], stream: null,
  seed: 7, clockStart: performance.now()
};
var UI = { tab: 'vis' };
var cv = document.createElement('canvas'), g = null;
var work = document.createElement('canvas'), wg = null;   /* 픽셀 패턴용 저해상 작업 캔버스 */

function period() {
  var base = PATTERNS[V.pattern].base;
  if (V.pattern === 'breath') base = V.breathSec * Math.max(1, Math.round(60 / V.breathSec));
  return base / V.speed;
}
/** 녹화 길이를 주기의 정수배로 스냅 (최소 1주기) */
function snapDuration(sec, P) { return Math.max(1, Math.round(sec / P)) * P; }
function bgColor() {
  var p = PALETTES[V.palette];
  return [lerp(0, p.bg[0], V.bgLevel), lerp(0, p.bg[1], V.bgLevel), lerp(0, p.bg[2], V.bgLevel)];
}
function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a + ')'; }

/* ==========================================================================
   2. 패턴 렌더러 — 전부 위상 t∈[0,1) 로만 그립니다. 시간 계수는 정수만.
   ========================================================================== */
var cache = { key: '', items: null };
function layout(n, fn) {   /* 밀도·시드가 바뀔 때만 배치 재생성 */
  var key = V.pattern + '|' + n + '|' + V.seed + '|' + cv.width + 'x' + cv.height;
  if (cache.key !== key) { var r = rng(V.seed * 1000 + n); cache = { key: key, items: [] }; for (var i = 0; i < n; i++) cache.items.push(fn(r, i)); }
  return cache.items;
}
function fill(ctx, W, H) { var b = bgColor(); ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = rgba(b, 1); ctx.fillRect(0, 0, W, H); }

function drawNebula(ctx, W, H, t) {
  fill(ctx, W, H);
  var pal = PALETTES[V.palette], n = Math.round(lerp(4, 14, V.density));
  var blobs = layout(n, function (r, i) {
    return { ax: 0.15 + r() * 0.3, ay: 0.15 + r() * 0.3, kx: 1 + Math.floor(r() * 2), ky: 1 + Math.floor(r() * 2),
             px: r(), py: r(), rad: 0.25 + r() * 0.35, kr: 1 + Math.floor(r() * 2), pr: r(), ci: i % 3, a: 0.35 + r() * 0.4 };
  });
  ctx.globalCompositeOperation = 'lighter';
  var R = Math.max(W, H);
  blobs.forEach(function (b) {
    var cx = W * (0.5 + b.ax * Math.sin(TAU * (b.kx * t + b.px)));
    var cy = H * (0.5 + b.ay * Math.cos(TAU * (b.ky * t + b.py)));
    var rad = R * b.rad * (1 + 0.15 * Math.sin(TAU * (b.kr * t + b.pr))) * lerp(0.7, 1.2, V.glow);
    var grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    var c = pal.c[b.ci], a = b.a * lerp(0.35, 0.9, V.glow);
    grd.addColorStop(0, rgba(c, a * 0.55)); grd.addColorStop(0.45, rgba(c, a * 0.18)); grd.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = grd; ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  });
}
function drawStars(ctx, W, H, t) {
  fill(ctx, W, H);
  var pal = PALETTES[V.palette], n = Math.round(lerp(150, 900, V.density));
  var stars = layout(n, function (r) {
    return { x: r(), y: r(), s: 0.6 + r() * 1.8, k: 1 + Math.floor(r() * 4), p: r(), c: r() < 0.8 ? 2 : Math.floor(r() * 2) };
  });
  var sc = Math.min(W, H) / 1080;
  ctx.globalCompositeOperation = 'lighter';
  stars.forEach(function (s) {
    var x = ((s.x + t * 0.5 * 1) % 1) * W;         /* 주기당 화면 절반 이동… 정수 랩이 필요 → 아래처럼 */
    x = ((s.x + t) % 1) * W;                        /* 주기당 정확히 1회 랩(정수) */
    var y = ((s.y + t * 0) % 1) * H;
    var tw = 0.55 + 0.45 * Math.sin(TAU * (s.k * t + s.p));
    var rad = s.s * sc * lerp(1, 2.2, V.glow);
    var c = pal.c[s.c];
    ctx.fillStyle = rgba([lerp(c[0], 255, .6), lerp(c[1], 255, .6), lerp(c[2], 255, .6)], tw * lerp(0.5, 1, V.glow));
    ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
    if (V.glow > 0.4 && s.s > 1.8) {
      var grd = ctx.createRadialGradient(x, y, 0, x, y, rad * 6);
      grd.addColorStop(0, rgba(c, 0.25 * tw * V.glow)); grd.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = grd; ctx.fillRect(x - rad * 6, y - rad * 6, rad * 12, rad * 12);
    }
  });
  /* 유성: 주기 안 정해진 위상에 M개, 각 1.6초 동안 — 위상 기반이라 루프에서도 같은 자리 */
  var P = period(), M = 3, life = 1.6 / P;
  var mets = layout(M + 1000, function (r, i) { return { at: r(), x0: r(), y0: r() * 0.5, dx: 0.12 + r() * 0.15, dy: 0.08 + r() * 0.1 }; }).slice(0, M);
  mets.forEach(function (m) {
    var d = ((t - m.at) % 1 + 1) % 1; if (d > life) return;
    var p = d / life, x = (m.x0 + m.dx * p) * W, y = (m.y0 + m.dy * p) * H, len = 0.06 * W;
    var grd = ctx.createLinearGradient(x - len, y - len * 0.6, x, y);
    var a = Math.sin(Math.PI * p) * 0.9;
    grd.addColorStop(0, 'rgba(255,255,255,0)'); grd.addColorStop(1, 'rgba(255,255,255,' + a + ')');
    ctx.strokeStyle = grd; ctx.lineWidth = 2 * sc; ctx.beginPath(); ctx.moveTo(x - len, y - len * 0.6); ctx.lineTo(x, y); ctx.stroke();
  });
}
function drawBreath(ctx, W, H, t) {
  fill(ctx, W, H);
  var pal = PALETTES[V.palette], cycles = Math.max(1, Math.round(60 / V.breathSec));
  var b = 0.5 - 0.5 * Math.cos(TAU * cycles * t);          /* 0(호기)→1(흡기) 부드럽게 */
  var cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.42, rings = Math.round(lerp(3, 9, V.density));
  ctx.globalCompositeOperation = 'lighter';
  var core = R * lerp(0.28, 0.72, b) * lerp(0.85, 1.05, V.glow);
  var grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, core * 1.6);
  var c = pal.c[0];
  grd.addColorStop(0, rgba(c, 0.45 * lerp(0.6, 1, V.glow))); grd.addColorStop(0.5, rgba(c, 0.14 * lerp(0.6, 1, V.glow))); grd.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

/* ---------- 미리듣기 ---------- */

  var ctx = new AC();

/* ---------- 오프라인 렌더링 (분할) + WAV 인코딩 ---------- */
