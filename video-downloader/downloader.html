<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영상 다운로더 · yt-dlp 리모컨</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --panel3:#232c37;
  --line:#2b3440; --line2:#3a4553;
  --text:#e6edf3; --muted:#93a1b1; --dim:#6e7d8e;
  --accent:#2ea87a; --accent-ink:#fff;
  --yt:#ff4d5e; --ig:#e1306c; --tt:#25f4ee;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --radius:13px; --shadow:0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace}
.app{max-width:980px;margin:0 auto;padding:0 18px 60px;padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:15px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(46,168,122,.2)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--dim);letter-spacing:0}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:.14s;font-size:13px;font-weight:600}
.btn:hover{background:var(--panel3);border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff7b7b}
.btn.danger:hover{background:rgba(208,59,59,.14);border-color:var(--critical)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:11px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
.input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,168,122,.16)}
textarea{resize:vertical;min-height:96px;line-height:1.5}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:16px;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.card h2 .step{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800}
.card h2 .sub{font-weight:500;font-size:12px;color:var(--dim);margin-left:2px}
.card p.lead{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.tip{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.tip b{color:var(--text)} .tip.warn{border-left-color:var(--warning)} .tip.crit{border-left-color:var(--critical)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.b-gray{background:var(--panel3);color:var(--muted);border-color:var(--line)}
.b-yt{background:rgba(255,77,94,.16);color:var(--yt);border-color:rgba(255,77,94,.45)}
.b-ig{background:rgba(225,48,108,.16);color:#ff7aa8;border-color:rgba(225,48,108,.45)}
.b-tt{background:rgba(37,244,238,.14);color:var(--tt);border-color:rgba(37,244,238,.4)}
.b-bad{background:rgba(208,59,59,.16);color:#ff8a8a;border-color:rgba(208,59,59,.45)}
.b-ok{background:rgba(46,168,122,.16);color:#5fd3a3;border-color:rgba(46,168,122,.45)}
pre.cmd{background:#0a0d12;border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin:0;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;color:#d7e2ee;position:relative}
pre.cmd .k{color:#7ee2b8} pre.cmd .u{color:#9cc4ff}
.os{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.os button{background:var(--panel2);border:none;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.os button.on{background:var(--accent);color:#fff}
.links{display:flex;flex-direction:column;gap:7px}
.lk{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lk .u{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .id{font-size:11px;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace}
.empty{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:26px 20px;text-align:center;background:var(--panel)}
.empty .ico{font-size:32px;line-height:1;margin-bottom:8px}
.empty h4{margin:0 0 6px;font-size:15px}
.empty p{margin:0 auto;max-width:560px;color:var(--muted);font-size:13px}
.empty ol{text-align:left;max-width:560px;margin:10px auto 0;color:var(--muted);font-size:13px;padding-left:20px}
.sw{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;font-size:13px}
.sw input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex:0 0 auto}
table.hist{width:100%;border-collapse:collapse;font-size:12.5px}
table.hist th{text-align:left;padding:8px 9px;background:var(--panel2);color:var(--muted);font-size:11.5px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
table.hist td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
table.hist tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.faq>b{display:block;margin:12px 0 3px;font-size:13px}
.faq>p{margin:0;color:var(--muted);font-size:12.5px}
.faq p b{color:var(--text)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;font-weight:600;animation:tin .25s;max-width:90vw}
.toast.ok{border-color:var(--good)} .toast.err{border-color:var(--critical)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.foot-note{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;text-align:center}
@media(max-width:720px){.app{padding:0 12px 50px}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span><span>영상 다운로더<small>유튜브 · 인스타그램 · 틱톡 링크 → 원본 화질 저장 (yt-dlp 리모컨)</small></span></div>
    <div class="row"><span class="dim" style="font-size:12px">내 컴퓨터:</span><div class="os" id="osSel"><button data-os="win">Windows</button><button data-os="mac">Mac</button></div></div>
  </header>
  <main id="view"></main>
  <div class="foot-note">이 파일은 서버에 아무것도 보내지 않습니다 · 링크 목록은 이 브라우저(localStorage)에만 저장됩니다</div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================================
   영상 다운로더 — yt-dlp 리모컨 (단일 파일 / 외부 라이브러리 없음)
   브라우저는 CORS 와 서명 보호 때문에 영상을 직접 받을 수 없습니다.
   이 페이지는 링크를 인식하고 옵션을 골라 yt-dlp 명령/스크립트를 만들어 줍니다.
   ============================================================================ */
var LS_KEY = 'vdl_v1';
var DEFAULT_TEMPLATE = '%(title).100s [%(id)s].%(ext)s';

var PLAT = {
  youtube:   { name: 'YouTube',   cls: 'b-yt', emo: '▶️' },
  instagram: { name: 'Instagram', cls: 'b-ig', emo: '📸' },
  tiktok:    { name: 'TikTok',    cls: 'b-tt', emo: '🎵' }
};
/* yt-dlp 포맷 선택자. bv*=최고 영상, ba=최고 오디오, /b=합쳐진 단일 파일 폴백 */
var QUALITY = {
  best:  { name: '최고 화질 (원본)',  args: ['-f', 'bv*+ba/b'] },
  q2160: { name: '4K 까지 (2160p)',   args: ['-f', 'bv*[height<=2160]+ba/b[height<=2160]'] },
  q1080: { name: '1080p 까지',        args: ['-f', 'bv*[height<=1080]+ba/b[height<=1080]'] },
  q720:  { name: '720p 까지',         args: ['-f', 'bv*[height<=720]+ba/b[height<=720]'] },
  audio: { name: '오디오만 (mp3)',    args: ['-x', '--audio-format', 'mp3', '--audio-quality', '0'] }
};
var COOKIES = [['none', '사용 안 함'], ['chrome', 'Chrome'], ['edge', 'Edge'], ['firefox', 'Firefox'], ['brave', 'Brave'], ['safari', 'Safari (Mac)']];
var INSTALL = {
  win: { title: 'Windows', open: 'Win + X → "터미널" (또는 시작 메뉴에서 PowerShell)', steps: [
    ['yt-dlp 설치', 'winget install yt-dlp.yt-dlp'],
    ['ffmpeg 설치 — 영상+오디오를 합치는 데 필요', 'winget install Gyan.FFmpeg'],
    ['설치 확인 (버전이 나오면 성공)', 'yt-dlp --version'] ] },
  mac: { title: 'Mac', open: 'Spotlight(⌘ + Space) → "터미널"', steps: [
    ['Homebrew 가 없으면 먼저 설치', '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'],
    ['yt-dlp + ffmpeg 설치', 'brew install yt-dlp ffmpeg'],
    ['설치 확인 (버전이 나오면 성공)', 'yt-dlp --version'] ] }
};

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function on(s, ev, fn, r) { $$(s, r).forEach(function (n) { n.addEventListener(ev, fn); }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg, kind) {
  var box = $('#toast'), t = document.createElement('div');
  t.className = 'toast ' + (kind || ''); t.textContent = msg; box.appendChild(t);
  setTimeout(function () { t.style.transition = '.3s'; t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 320); }, 2800);
}
function copyText(txt, okMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast(okMsg || '복사했습니다', 'ok'); }, function () { prompt('아래 내용을 복사하세요', txt); });
  } else prompt('아래 내용을 복사하세요', txt);
}
function download(filename, content, mime) {
  var blob = new Blob([content], { type: mime || 'application/octet-stream' });
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
}
function stamp() { var d = new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'); }
function fmtTime(ms) { var d = new Date(ms); return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function guessOs() { var p = (navigator.platform || '') + ' ' + (navigator.userAgent || ''); return /Mac|iPhone|iPad/i.test(p) ? 'mac' : 'win'; }

/* ==========================================================================
   1. 플랫폼 인식 — 링크 한 줄 → { ok, platform, id, kind, url }
   ========================================================================== */
var YT_ID = /^[A-Za-z0-9_-]{11}$/;
function detect(raw) {
  var s = String(raw || '').trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s.replace(/^\/+/, '');
  var u; try { u = new URL(s); } catch (e) { return { ok: false, raw: raw, reason: '주소 형식이 아닙니다' }; }
  var h = u.hostname.toLowerCase().replace(/^(www|m|mobile)\./, '');

  if (/(^|\.)youtube\.com$|^youtu\.be$|(^|\.)youtube-nocookie\.com$/.test(h)) {
    var id = null, kind = 'video', m;
    if (h === 'youtu.be') id = u.pathname.split('/')[1] || '';
    else if (u.searchParams.get('v')) id = u.searchParams.get('v');
    else if ((m = u.pathname.match(/\/(shorts|live|embed|v)\/([A-Za-z0-9_-]{11})/))) { id = m[2]; kind = m[1] === 'shorts' ? 'shorts' : 'video'; }
    if (!id || !YT_ID.test(id)) {
      if (/\/playlist/.test(u.pathname) || (u.searchParams.get('list') && !id)) return { ok: false, raw: raw, platform: 'youtube', reason: '재생목록 링크입니다 — 영상 하나의 링크를 넣어주세요' };
      if (/^\/(@|channel\/|c\/|user\/)/.test(u.pathname)) return { ok: false, raw: raw, platform: 'youtube', reason: '채널 링크입니다 — 영상 링크를 넣어주세요' };
      return { ok: false, raw: raw, platform: 'youtube', reason: '영상 ID 를 찾지 못했습니다' };
    }
    return { ok: true, raw: raw, platform: 'youtube', id: id, kind: kind, url: kind === 'shorts' ? 'https://www.youtube.com/shorts/' + id : 'https://www.youtube.com/watch?v=' + id };
  }
  if (/(^|\.)instagram\.com$/.test(h)) {
    var m2 = u.pathname.match(/\/(reel|reels|p|tv)\/([A-Za-z0-9_-]{5,})/);
    if (!m2) return { ok: false, raw: raw, platform: 'instagram', reason: '게시물 링크(/reel/… 또는 /p/…)가 아닙니다' };
    var type = m2[1] === 'reels' ? 'reel' : m2[1];
    return { ok: true, raw: raw, platform: 'instagram', id: m2[2], kind: type, url: 'https://www.instagram.com/' + type + '/' + m2[2] + '/', needsLogin: true };
  }
  if (/(^|\.)tiktok\.com$/.test(h)) {
    var m3 = u.pathname.match(/\/(video|photo)\/(\d+)/);
    if (m3) {
      var user = (u.pathname.match(/\/(@[\w.\-]+)\//) || [])[1];
      return { ok: true, raw: raw, platform: 'tiktok', id: m3[2], kind: m3[1], photo: m3[1] === 'photo',
               url: user ? 'https://www.tiktok.com/' + user + '/' + m3[1] + '/' + m3[2] : s.split('?')[0] };
    }
    if (/^(vm|vt)\.tiktok\.com$/.test(h) || /^\/t\/[A-Za-z0-9]+/.test(u.pathname) || /^\/[A-Za-z0-9]{6,12}\/?$/.test(u.pathname)) {
      return { ok: true, raw: raw, platform: 'tiktok', id: u.pathname.replace(/\//g, '') || '-', kind: 'short', shortLink: true, url: s.split('?')[0] };
    }
    return { ok: false, raw: raw, platform: 'tiktok', reason: '영상 링크(/video/…)가 아닙니다' };
  }
  return { ok: false, raw: raw, reason: '지원하지 않는 사이트입니다 (유튜브·인스타그램·틱톡만)' };
}
function parseLinks(text) {
  var out = [], seen = {};
  String(text || '').split(/[\n\r,\s]+/).forEach(function (line) {
    var r = detect(line); if (!r) return;
    var key = r.ok ? r.url : r.raw;
    if (seen[key]) return; seen[key] = 1;
    out.push(r);
  });
  return out;
}

/* ==========================================================================
   2. 명령 · 스크립트 생성
   ========================================================================== */
function buildArgs(o) {
  var a = [];
  if (o.quality === 'audio') a = a.concat(QUALITY.audio.args);
  else a = a.concat((QUALITY[o.quality] || QUALITY.best).args, ['-S', 'res,ext:mp4:m4a', '--merge-output-format', 'mp4']);
  a.push('--no-playlist');
  if (o.cookies && o.cookies !== 'none') a.push('--cookies-from-browser', o.cookies);
  if (o.subs) a.push('--write-subs', '--sub-langs', 'ko,en', '--embed-subs');
  if (o.thumb) a.push('--embed-thumbnail');
  if (o.meta) a.push('--embed-metadata');
  if (o.folder) a.push('-P', o.folder);
  a.push('-o', o.template || DEFAULT_TEMPLATE);
  if (o.os === 'win') a.push('--windows-filenames');
  return a;
}
/* 공백·특수문자가 있으면 큰따옴표. Windows(cmd/PowerShell) 는 "" 로, Mac 은 \" 로 내부 따옴표 이스케이프 */
function shQuote(x, os) {
  x = String(x);
  if (/^[A-Za-z0-9_\-.:=,+\/@~]+$/.test(x)) return x;
  return '"' + x.replace(/"/g, os === 'win' ? '""' : '\\"') + '"';
}
function buildCommand(links, o) {
  return ['yt-dlp'].concat(buildArgs(o).map(function (x) { return shQuote(x, o.os); }),
                           links.map(function (l) { return shQuote(l.url, o.os); })).join(' ');
}
/* 더블클릭용 스크립트. 배치 파일 안에서는 % 를 %% 로 써야 합니다 (출력 템플릿의 %(title)s 등) */
function buildScript(links, o) {
  var cmd = buildCommand(links, o);
  if (o.os === 'win') {
    return ['@echo off', 'chcp 65001 >nul', 'title Video Downloader (yt-dlp)', 'echo Downloading ' + links.length + ' link(s)...',
            o.update ? 'yt-dlp -U' : 'rem (auto-update off)', cmd.replace(/%/g, '%%'), 'echo.', 'echo Done. You can close this window.', 'pause'].join('\r\n') + '\r\n';
  }
  return ['#!/bin/bash', 'echo "Downloading ' + links.length + ' link(s)..."', o.update ? 'yt-dlp -U' : '# (auto-update off)', cmd, 'echo', 'echo "Done."', 'read -p "Press Enter to close "'].join('\n') + '\n';
}
function scriptName(o) { return 'download-' + stamp() + (o.os === 'win' ? '.bat' : '.sh'); }

/* ==========================================================================
   3. 상태 · 저장
   ========================================================================== */
var state = null;
function defaults() {
  return { v: 1, os: guessOs(), installed: false, quality: 'best', cookies: 'none', subs: false, thumb: false, meta: true,
           folder: '', template: DEFAULT_TEMPLATE, update: true, text: '', history: [] };
}
function load() {
  try { var raw = localStorage.getItem(LS_KEY); if (!raw) return defaults();
    var s = JSON.parse(raw); if (!s || typeof s !== 'object') return defaults();
    var d = defaults(); Object.keys(d).forEach(function (k) { if (s[k] === undefined) s[k] = d[k]; });
    if (!Array.isArray(s.history)) s.history = [];
    if (s.os !== 'win' && s.os !== 'mac') s.os = guessOs();
    return s;
  } catch (e) { return defaults(); }
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* noop */ } }
function opts() { return { os: state.os, quality: state.quality, cookies: state.cookies, subs: state.subs, thumb: state.thumb, meta: state.meta, folder: state.folder.trim(), template: state.template.trim() || DEFAULT_TEMPLATE, update: state.update }; }
function pushHistory(links, how) {
  var now = Date.now();
  links.forEach(function (l) {
    state.history = state.history.filter(function (h) { return h.url !== l.url; });
    state.history.unshift({ t: now, url: l.url, platform: l.platform, id: l.id, quality: state.quality, how: how });
  });
