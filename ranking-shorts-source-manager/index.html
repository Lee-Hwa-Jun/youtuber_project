<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>랭킹 쇼츠 · 영상 소스 수집 매니저</title>
<style>
/* ===================== 테마 토큰 ===================== */
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1b222c; --panel3:#212a35;
  --line:#2b3440; --line2:#3a4553;
  --text:#e6edf3; --muted:#93a1b1; --dim:#6e7d8e;
  --accent:#ff5a5f; --accent-ink:#fff;
  --blue:#4c8dff; --green:#2ea043; --yellow:#d29922; --red:#f85149; --purple:#a371f7;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --radius:14px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#f0f3f7; --panel3:#e7ecf3;
  --line:#d9e0e8; --line2:#c3cdd9;
  --text:#16202b; --muted:#5b6b7c; --dim:#87939f;
  --accent:#e0393e; --accent-ink:#fff;
  --blue:#1f6feb; --green:#1a7f37; --yellow:#9a6700; --red:#cf222e; --purple:#8250df;
  --shadow:0 8px 24px rgba(20,30,45,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ===================== 레이아웃 ===================== */
.app{max-width:1180px;margin:0 auto;padding:0 16px 80px;
     padding-top:env(safe-area-inset-top,0px)}
.topbar{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:0;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,90,95,.18)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--dim);letter-spacing:0}
.proj-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ===================== 공통 컴포넌트 ===================== */
.btn{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:8px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;
  transition:.14s;font-size:13px;font-weight:600;
}
.btn:hover{background:var(--panel3);border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--line)}
.btn.danger:hover{background:rgba(248,81,73,.12);border-color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.xs{padding:3px 7px;font-size:11px;border-radius:7px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input,select,textarea{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;width:100%;outline:none;transition:.14s;
}
.input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,90,95,.14)}
textarea{resize:vertical;min-height:62px}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 12px;font-size:15px;letter-spacing:-.2px}
.card h3 .sub{font-weight:500;font-size:12px;color:var(--dim);margin-left:6px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 12px}
.sec-title h2{margin:0;font-size:19px;letter-spacing:-.4px}
.sec-title p{margin:3px 0 0;font-size:12.5px;color:var(--dim)}
.divider{height:1px;background:var(--line);margin:16px 0}

/* 탭 */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 0;margin-bottom:4px;
      position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;
      border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  padding:9px 13px;cursor:pointer;white-space:nowrap;font-weight:700;font-size:13.5px;border-radius:8px 8px 0 0;
}
.tab:hover{color:var(--text);background:var(--panel2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{display:inline-block;margin-left:5px;background:var(--panel3);color:var(--muted);
  font-size:11px;padding:1px 6px;border-radius:20px;font-weight:700}
.tab.active .cnt{background:rgba(255,90,95,.18);color:var(--accent)}

/* 뱃지 */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  padding:3px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.b-gray{background:var(--panel3);color:var(--muted);border-color:var(--line)}
.b-green{background:rgba(46,160,67,.16);color:var(--green);border-color:rgba(46,160,67,.4)}
.b-blue{background:rgba(76,141,255,.16);color:var(--blue);border-color:rgba(76,141,255,.4)}
.b-yellow{background:rgba(210,153,34,.16);color:var(--yellow);border-color:rgba(210,153,34,.4)}
.b-red{background:rgba(248,81,73,.16);color:var(--red);border-color:rgba(248,81,73,.4)}
.b-purple{background:rgba(163,113,247,.16);color:var(--purple);border-color:rgba(163,113,247,.4)}

/* 진행바 */
.bar{height:10px;background:var(--panel3);border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff9066);border-radius:20px;transition:width .4s}
.bar.g>i{background:linear-gradient(90deg,var(--green),#5ed37e)}
.bar.b>i{background:linear-gradient(90deg,var(--blue),#8ab6ff)}
.bar.sm{height:7px}

/* 통계 */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:0}

/* 빈 상태 안내 */
.empty{
  border:1.5px dashed var(--line2);border-radius:var(--radius);padding:28px 20px;text-align:center;
  background:var(--panel);
}
.empty .ico{font-size:34px;line-height:1;margin-bottom:10px}
.empty h4{margin:0 0 8px;font-size:16px}
.empty p{margin:0 auto;max-width:560px;color:var(--muted);font-size:13px}
.empty ol,.empty ul{text-align:left;max-width:560px;margin:12px auto 0;color:var(--muted);font-size:13px;padding-left:20px}
.empty li{margin:5px 0}
.empty .btnbox{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* 도움말 박스 */
.tip{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--blue);
     border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.tip b{color:var(--text)}

/* ===================== 검색어 ===================== */
.kw{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.kw-head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.kw-text{font-weight:700;font-size:14.5px;word-break:break-word;flex:1;min-width:0}
.kw-links{display:flex;flex-wrap:wrap;gap:6px}
.plat-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);text-decoration:none;transition:.14s;cursor:pointer}
.plat-btn:hover{background:var(--panel3);border-color:var(--line2);transform:translateY(-1px)}
.plat-btn.yt:hover{border-color:#ff0033;color:#ff4d6a}
.plat-btn.tt:hover{border-color:#25f4ee;color:#25f4ee}
.plat-btn.ig:hover{border-color:#e1306c;color:#f06292}
.plat-btn.rd:hover{border-color:#ff4500;color:#ff6a33}
.plat-btn.gg:hover{border-color:#4285f4;color:#6ba0ff}

/* ===================== 유튜브 결과 카드 ===================== */
.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.yt-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.yt-card .thumb{position:relative;aspect-ratio:16/9;background:var(--panel3);overflow:hidden}
.yt-card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.yt-card .thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;
  font-size:11px;font-weight:700;padding:2px 5px;border-radius:5px}
.yt-card .body{padding:10px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.yt-card .t{font-size:13px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yt-card .m{font-size:11.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 8px}
.yt-card .acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.yt-card .acts .btn{flex:1;text-align:center}

/* ===================== 클립 테이블 ===================== */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.clips{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
table.clips th{
  text-align:left;padding:10px 8px;background:var(--panel2);color:var(--muted);
  font-size:11.5px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0
}
table.clips th.s{cursor:pointer;user-select:none}
table.clips th.s:hover{color:var(--text)}
table.clips td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.clips tr:last-child td{border-bottom:none}
table.clips tr:hover td{background:var(--panel2)}
.tn-ph{position:relative;flex:0 0 auto;width:74px;height:42px;border-radius:6px;background:var(--panel3);
  display:flex;align-items:center;justify-content:center;font-size:17px;overflow:hidden}
.tn{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:6px}
.c-title{font-weight:700;display:block;max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-note{font-size:12px;color:var(--muted);max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{color:var(--yellow);letter-spacing:1px;white-space:nowrap;font-size:13px}
.stars .off{color:var(--line2)}
.acts-cell{display:flex;gap:5px;white-space:nowrap}

/* 별점 입력 */
.star-input{display:flex;gap:3px}
.star-input button{background:none;border:none;cursor:pointer;font-size:24px;line-height:1;padding:0 1px;color:var(--line2);transition:.1s}
.star-input button.on{color:var(--yellow)}
.star-input button:hover{transform:scale(1.15)}

/* ===================== 랭킹 보드 ===================== */
.rank-layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.slot{
  display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px;margin-bottom:10px;transition:.15s;min-height:86px
}
.slot.over{border-color:var(--accent);background:rgba(255,90,95,.08);transform:scale(1.005)}
.slot.filled{border-color:var(--line2)}
.slot .no{
  flex:0 0 52px;height:52px;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:900;font-size:19px;letter-spacing:-1px;
  background:var(--panel3);color:var(--muted)
}
.slot .no small{font-size:9px;font-weight:700;letter-spacing:0}
.slot[data-r="1"] .no{background:linear-gradient(145deg,#ffd75e,#e8a200);color:#3a2a00}
.slot[data-r="2"] .no{background:linear-gradient(145deg,#e3e9f0,#9fb0c2);color:#28323d}
.slot[data-r="3"] .no{background:linear-gradient(145deg,#e0a26a,#b06f38);color:#33200c}
.slot .inner{flex:1;min-width:0}
.slot .guide{font-size:12px;color:var(--dim)}
.slot .ph{color:var(--dim);font-size:13px}
.slot .ttl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;align-items:center}
.slot .sec{width:66px;padding:4px 7px;font-size:12px;text-align:right}
.cand{
  display:flex;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px;margin-bottom:7px;cursor:grab;transition:.14s
}
.cand:hover{border-color:var(--line2);background:var(--panel2)}
.cand.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,90,95,.16)}
.cand.used{opacity:.42}
.cand:active{cursor:grabbing}
.cand .ci{flex:1;min-width:0}
.cand .ct{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .cm{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runtime-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.runtime-big{font-size:32px;font-weight:800;letter-spacing:-1.5px}

/* ===================== 모달 ===================== */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:20px 14px;z-index:100;overflow-y:auto
}
.modal{
  background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);
  width:100%;max-width:560px;margin:auto;padding:18px
}
.modal h3{margin:0 0 14px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.fields{display:flex;flex-direction:column;gap:12px}

/* 토스트 */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);color:var(--text);padding:10px 16px;
  border-radius:12px;box-shadow:var(--shadow);font-size:13px;font-weight:600;animation:tin .25s}
.toast.ok{border-color:var(--green)} .toast.err{border-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 푸터 */
.foot-note{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--dim);font-size:11.5px;text-align:center}

/* ===================== 반응형 ===================== */
@media(max-width:900px){
  .rank-layout{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media(max-width:700px){
  .app{padding:0 12px 70px}
  .grid2,.grid3{grid-template-columns:1fr}
  .brand span{font-size:15px}
  .proj-ctl{width:100%}
  .proj-ctl select{flex:1;min-width:120px}
  .sec-title h2{font-size:17px}
  table.clips{min-width:0}
  table.clips thead{display:none}
  table.clips tr{display:block;border:1px solid var(--line);border-radius:12px;margin:10px;padding:6px 8px;background:var(--panel2)}
  table.clips td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:none;padding:5px 2px}
  table.clips td::before{content:attr(data-l);color:var(--dim);font-size:11px;font-weight:700;flex:0 0 auto}
  table.clips td:empty{display:none}
  .table-wrap{background:transparent;border:none}
  .c-title,.c-note{max-width:100%;white-space:normal;text-align:right}
  table.clips td:nth-child(2){flex-direction:column;align-items:flex-start;gap:2px}
  table.clips td:nth-child(2) .c-title,table.clips td:nth-child(2) .c-note{text-align:left}
  .acts-cell{justify-content:flex-end;flex-wrap:wrap}
  .runtime-big{font-size:27px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>랭킹 쇼츠 소스 매니저<small>클립 찾기 · 기록 · 랭킹 배치</small></span>
    </div>
    <div class="proj-ctl">
      <select id="projectSelect" title="프로젝트 선택" style="width:auto;min-width:160px"></select>
      <button class="btn primary" id="btnNewProject">＋ 새 프로젝트</button>
      <button class="btn ghost" id="btnEditProject" title="프로젝트 설정">⚙</button>
      <button class="btn ghost" id="btnTheme" title="테마 전환">🌙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>

  <div class="foot-note">
    모든 데이터는 이 브라우저(localStorage)에만 저장됩니다 · 브라우저 데이터 삭제 시 사라지니 <b>설정 탭에서 주기적으로 JSON 백업</b>하세요
  </div>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ============================================================
   랭킹 쇼츠 · 영상 소스 수집 매니저  (단일 파일 / 외부 라이브러리 없음)
   ============================================================ */

/* ---------- 상수 ---------- */
var LS_KEY = 'rssm_v1';
var DEFAULT_CATEGORIES = ['무서워하는 반응','맞서 싸우는 반응','반전·의외의 반응'];
var DEFAULT_KEYWORDS = [
  'dog scared of vacuum','dog vs vacuum cleaner','dog vacuum reaction',
  'dog afraid roomba','dog rides roomba','강아지 청소기','로봇청소기 강아지'
];
var LICENSES = [
  {v:'미확인',        cls:'b-gray',   emo:'⚪'},
  {v:'DM 보냄',       cls:'b-yellow', emo:'✉️'},
  {v:'허락받음',      cls:'b-green',  emo:'✅'},
  {v:'CC·퍼블릭도메인',cls:'b-blue',   emo:'🅭'},
  {v:'라이선스 구매', cls:'b-purple', emo:'💳'},
  {v:'사용불가',      cls:'b-red',    emo:'⛔'}
];
var USABLE = ['허락받음','CC·퍼블릭도메인','라이선스 구매'];
var RANK_GUIDE = {
  5:'무난하지만 확실한 웃음. 오프닝이라 짧고 바로 이해되는 클립이 좋아요.',
  4:'리액션이 한 단계 더 큰 클립. 시청자가 "다음은?" 하고 기대하게 만드세요.',
  3:'중간 텐션 유지 구간. 앞뒤와 다른 카테고리를 넣어 지루함을 끊어주세요.',
  2:'임팩트 최상위권. 1위 직전 텐션을 최대로 끌어올리는 클립.',
  1:'최고 임팩트 또는 반전. 가장 강한 웃음이나 예상 밖 결말을 배치하세요.'
};
var TABS = [
  {id:'dash',     name:'대시보드',  icon:'📊'},
  {id:'keywords', name:'검색어',    icon:'🔎'},

  youtube:{name:'YouTube', emo:'▶️'}, shorts:{name:'YT Shorts', emo:'📱'},
  tiktok:{name:'TikTok', emo:'🎵'}, instagram:{name:'Instagram', emo:'📸'},

/* ---------- 유틸 ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(sel,root){ return (root||document).querySelector(sel); }
function $$(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function on(sel,ev,fn,root){ $$(sel,root).forEach(function(n){ n.addEventListener(ev,fn); }); }
function daysSince(iso){ if(!iso) return 0; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function fmtDate(iso){ if(!iso) return '-'; var d=new Date(iso);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }
function fmtNum(n){ if(n==null||isNaN(n)) return '-';
  n=Number(n);
  if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if(n>=10000) return (n/10000).toFixed(1).replace(/\.0$/,'')+'만';
  return n.toLocaleString('ko-KR'); }
function fmtSec(s){ s=Math.max(0,Math.round(s||0)); var m=Math.floor(s/60), r=s%60;
  return m>0 ? m+'분 '+r+'초' : r+'초'; }
function licMeta(v){ for(var i=0;i<LICENSES.length;i++){ if(LICENSES[i].v===v) return LICENSES[i]; } return LICENSES[0]; }
function toast(msg,kind){
  var box=$('#toast'); var t=document.createElement('div');
  t.className='toast '+(kind||''); t.textContent=msg; box.appendChild(t);
  setTimeout(function(){ t.style.transition='.3s'; t.style.opacity='0'; setTimeout(function(){ t.remove(); },320); },2200);
}
function openTab(url){ window.open(url,'_blank','noopener'); }

/* ---------- 플랫폼 감지 / 썸네일 ---------- */
function detectPlatform(url){
  var u=String(url||'').toLowerCase();
  if(!u) return 'etc';
  if(u.indexOf('youtube.com/shorts')>-1) return 'shorts';
  if(u.indexOf('youtube.com')>-1||u.indexOf('youtu.be')>-1) return 'youtube';
  if(u.indexOf('tiktok.com')>-1) return 'tiktok';
  if(u.indexOf('instagram.com')>-1) return 'instagram';
  if(u.indexOf('reddit.com')>-1||u.indexOf('redd.it')>-1) return 'reddit';
  if(u.indexOf('twitter.com')>-1||u.indexOf('x.com')>-1) return 'twitter';
  if(u.indexOf('facebook.com')>-1||u.indexOf('fb.watch')>-1) return 'facebook';
  return 'etc';
}
function youtubeId(url){
  var u=String(url||''); var m;
  m=u.match(/[?&]v=([A-Za-z0-9_-]{11})/);        if(m) return m[1];
  m=u.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);   if(m) return m[1];
  m=u.match(/shorts\/([A-Za-z0-9_-]{11})/);      if(m) return m[1];
  m=u.match(/embed\/([A-Za-z0-9_-]{11})/);       if(m) return m[1];
  return null;
}
function autoThumb(url){
  var id=youtubeId(url);
  return id ? 'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg' : '';
}
function thumbHTML(c){
  var emo=(PLATFORMS[c.platform]||PLATFORMS.etc).emo;
  return '<div class="tn-ph">'+emo+
    (c.thumb?'<img class="tn" src="'+esc(c.thumb)+'" alt="" loading="lazy" onerror="this.remove()">':'')+
    '</div>';
}
function platBadge(p){
  var m=PLATFORMS[p]||PLATFORMS.etc;
  return '<span class="badge b-gray">'+m.emo+' '+esc(m.name)+'</span>';
}

function blankProject(name){
  return {
    id:uid(), name:name||'새 프로젝트', target:25,
    categories:DEFAULT_CATEGORIES.slice(),
    keywords:DEFAULT_KEYWORDS.slice(),
    clips:[], ranking:{'1':null,'2':null,'3':null,'4':null,'5':null},
    createdAt:new Date().toISOString()
  };
}
function defaultState(){
  var p=blankProject('Dog vs Vacuum');
  return { version:1, apiKey:'', theme:'dark', activeId:p.id, projects:[p] };
}
function load(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    var s=JSON.parse(raw);
    if(!s||!Array.isArray(s.projects)||!s.projects.length) return defaultState();
    s.projects.forEach(normalizeProject);
    if(!s.activeId||!s.projects.some(function(p){return p.id===s.activeId;})) s.activeId=s.projects[0].id;
    if(typeof s.apiKey!=='string') s.apiKey='';
    if(s.theme!=='light') s.theme='dark';
    return s;
  }catch(e){ console.warn('저장 데이터 복구 실패',e); return defaultState(); }
}
function normalizeProject(p){
  p.id=p.id||uid(); p.name=p.name||'제목 없음';
  p.target=Number(p.target)>0?Number(p.target):25;
  if(!Array.isArray(p.categories)||!p.categories.length) p.categories=DEFAULT_CATEGORIES.slice();
  if(!Array.isArray(p.keywords)) p.keywords=DEFAULT_KEYWORDS.slice();
  if(!Array.isArray(p.clips)) p.clips=[];
  p.clips.forEach(function(c){
    c.id=c.id||uid(); c.url=c.url||''; c.platform=c.platform||detectPlatform(c.url);
    c.title=c.title||''; c.author=c.author||''; c.note=c.note||'';
    c.category=c.category||p.categories[0]; c.score=Number(c.score)||3;
    c.license=licMeta(c.license).v===c.license?c.license:'미확인';
    c.seconds=Number(c.seconds)||0;
    c.thumb=c.thumb||autoThumb(c.url);
    c.createdAt=c.createdAt||new Date().toISOString();
    c.licenseAt=c.licenseAt||c.createdAt;
    c.views=c.views==null?null:Number(c.views);
  });
  if(!p.ranking||typeof p.ranking!=='object') p.ranking={};
  ['1','2','3','4','5'].forEach(function(k){ if(p.ranking[k]===undefined) p.ranking[k]=null; });
  p.createdAt=p.createdAt||new Date().toISOString();
  return p;
}
function save(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }
  catch(e){ toast('저장 실패: 브라우저 저장 공간을 확인하세요','err'); }
}
function P(){ // 현재 프로젝트
  for(var i=0;i<state.projects.length;i++){ if(state.projects[i].id===state.activeId) return state.projects[i]; }
  return state.projects[0];
}
function clipById(id){ var p=P(); for(var i=0;i<p.clips.length;i++){ if(p.clips[i].id===id) return p.clips[i]; } return null; }

function renderShell(){
  document.documentElement.setAttribute('data-theme', state.theme);
  $('#btnTheme').textContent = state.theme==='dark' ? '🌙' : '☀️';

  var sel=$('#projectSelect');
  sel.innerHTML = state.projects.map(function(p){
    return '<option value="'+p.id+'"'+(p.id===state.activeId?' selected':'')+'>'+esc(p.name)+' ('+p.clips.length+')</option>';
  }).join('');

  var p=P();
  var counts={dash:'',keywords:p.keywords.length,ytapi:'',clips:p.clips.length,rank:rankFilled(),settings:''};
  $('#tabs').innerHTML = TABS.map(function(t){
    var c=counts[t.id];
    return '<button class="tab'+(ui.tab===t.id?' active':'')+'" data-tab="'+t.id+'">'+
           t.icon+' '+t.name+(c?'<span class="cnt">'+c+'</span>':'')+'</button>';
  }).join('');
  on('.tab','click',function(e){ ui.tab=e.currentTarget.getAttribute('data-tab'); render(); });
}
function rankFilled(){ var r=P().ranking, n=0; ['1','2','3','4','5'].forEach(function(k){ if(r[k]&&clipById(r[k])) n++; }); return n; }

function render(){
  renderShell();
  var v=$('#view');
  if(ui.tab==='dash') viewDash(v);
  else if(ui.tab==='keywords') viewKeywords(v);
  else if(ui.tab==='ytapi') viewYt(v);
  else if(ui.tab==='clips') viewClips(v);
  else if(ui.tab==='rank') viewRank(v);
  else viewSettings(v);
  save();
}

    var q=(($('#kwInput',v).value)||'').trim();
    if(!q){ toast('주제 키워드를 먼저 입력하세요','err'); return; }
    var ko=/[가-힣]/.test(q);
    var suf = ko ? ['','반응','웃긴','모음','무서워하는','처음 본','레전드']
                 : ['','reaction','funny','compilation','scared','first time','fails','best moments'];

function iso8601ToSec(d){
  var m=/^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(d||'');
  if(!m) return 0;
  return (+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0);
}
function ytSearch(q,order){
  var key=(state.apiKey||'').trim();
  ytLoading=true; ytError=''; ytResults=[]; render();
  var url='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoDuration=short'+
          '&order='+encodeURIComponent(order)+'&maxResults=25&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(key);
  fetch(url).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
  .then(function(res){
    if(!res.ok) throw new Error((res.j&&res.j.error&&res.j.error.message)||'HTTP 오류');
    var items=(res.j.items||[]).filter(function(it){ return it.id&&it.id.videoId; });
    ytResults=items.map(function(it){
      var s=it.snippet||{};
      return { id:it.id.videoId, title:s.title||'', channel:s.channelTitle||'',
               published:s.publishedAt||'', views:null, seconds:0,
               thumb:(s.thumbnails&&(s.thumbnails.medium||s.thumbnails.default)||{}).url||'' };
    });
    if(!ytResults.length){ ytLoading=false; render(); toast('검색 결과가 없습니다'); return null; }
    var ids=ytResults.map(function(r){ return r.id; }).join(',');
    return fetch('https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails&id='+ids+'&key='+encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(j){
        (j.items||[]).forEach(function(it){
          var t=ytResults.filter(function(r){ return r.id===it.id; })[0];
          if(!t) return;
          t.views=it.statistics?Number(it.statistics.viewCount):null;
          t.seconds=iso8601ToSec(it.contentDetails&&it.contentDetails.duration);
        });
        if(order==='viewCount') ytResults.sort(function(a,b){ return (b.views||0)-(a.views||0); });
        ytLoading=false; render(); toast(ytResults.length+'개 결과를 찾았습니다','ok');
      });
  })
  .catch(function(e){ ytLoading=false; ytError=e.message||String(e); render(); });
}

function filteredClips(){
  var p=P(), q=(ui.q||'').toLowerCase();
  var arr=p.clips.filter(function(c){
    if(ui.fCat && c.category!==ui.fCat) return false;
    if(ui.fLic && c.license!==ui.fLic) return false;
    if(q){
      var hay=(c.title+' '+c.note+' '+c.author+' '+c.url+' '+c.category).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
  var dir = ui.clipDir==='asc'?1:-1;
  arr.sort(function(a,b){
    if(ui.clipSort==='score')   return (a.score-b.score)*dir || (a.createdAt<b.createdAt?1:-1);
    if(ui.clipSort==='license') return (LICENSES.map(function(l){return l.v;}).indexOf(a.license)-
                                        LICENSES.map(function(l){return l.v;}).indexOf(b.license))*dir;
    if(ui.clipSort==='views')   return ((a.views||0)-(b.views||0))*dir;
    return (new Date(a.createdAt)-new Date(b.createdAt))*dir;
  });
  return arr;
}

    : '<div class="empty"><div class="ico">🔍</div><h4>조건에 맞는 클립이 없습니다</h4><p>필터를 바꾸거나 초기화해 보세요.</p></div>';

  v.innerHTML = head + quick + filters + table;

  on('#clipAdd','click',function(){ openClipModal(null); },v);
  on('#clipCsv','click',exportCsv,v);
  on('#quickGo','click',quickAdd,v);
  on('#quickUrl','keydown',function(e){ if(e.key==='Enter') quickAdd(); },v);
  on('#fQ','input',function(e){ ui.q=e.currentTarget.value; var pos=e.currentTarget.selectionStart;
    render(); var el=$('#fQ'); if(el){ el.focus(); el.setSelectionRange(pos,pos); } },v);
  on('#fCat','change',function(e){ ui.fCat=e.currentTarget.value; render(); },v);
  on('#fLic','change',function(e){ ui.fLic=e.currentTarget.value; render(); },v);
  on('#fSort','change',function(e){ ui.clipSort=e.currentTarget.value; render(); },v);
  on('#fDir','click',function(){ ui.clipDir=ui.clipDir==='desc'?'asc':'desc'; render(); },v);
  on('#fClear','click',function(){ ui.q=''; ui.fCat=''; ui.fLic=''; render(); },v);
  on('[data-sort]','click',function(e){
    var s=e.currentTarget.getAttribute('data-sort');
    if(ui.clipSort===s) ui.clipDir=ui.clipDir==='desc'?'asc':'desc'; else { ui.clipSort=s; ui.clipDir='desc'; }
    render();
  },v);
  on('[data-edit]','click',function(e){ openClipModal(clipById(e.currentTarget.getAttribute('data-edit'))); },v);
  on('[data-rev]','click',function(e){
    var c=clipById(e.currentTarget.getAttribute('data-rev'));
    if(c&&c.thumb) openTab('https://lens.google.com/uploadbyurl?url='+encodeURIComponent(c.thumb));
  },v);
  on('[data-del]','click',function(e){
    var c=clipById(e.currentTarget.getAttribute('data-del')); if(!c) return;
    if(!confirm('이 클립을 삭제할까요?\n\n'+(c.title||c.url))) return;
    var p=P();
    p.clips=p.clips.filter(function(x){ return x.id!==c.id; });
    ['1','2','3','4','5'].forEach(function(k){ if(p.ranking[k]===c.id) p.ranking[k]=null; });
    render(); toast('삭제했습니다','ok');
  },v);

  function quickAdd(){
    var el=$('#quickUrl',v); var u=(el.value||'').trim();
    if(!u){ toast('URL을 붙여넣으세요','err'); return; }
    el.value=''; openClipModal(null,{url:u});
  }
}

/* ---------- 클립 등록/수정 모달 ---------- */
function openClipModal(clip,prefill){
  var p=P();
  var c = clip ? JSON.parse(JSON.stringify(clip)) : Object.assign({
    id:null,url:'',platform:'etc',title:'',author:'',note:'',
    category:p.categories[0],score:3,license:'미확인',seconds:0,thumb:'',views:null
  }, prefill||{});
  if(!clip && c.url){ c.platform=detectPlatform(c.url); if(!c.thumb) c.thumb=autoThumb(c.url); }
  if(p.categories.indexOf(c.category)===-1) c.category=p.categories[0];

  var html=
  '<div class="modal-bg" id="mbg"><div class="modal">'+
    '<h3>'+(clip?'✎ 클립 수정':'＋ 클립 등록')+'<button class="x" id="mx">✕</button></h3>'+
    '<div class="fields">'+
      '<div><label class="f">영상 URL <span class="dim">(플랫폼 자동 감지)</span></label>'+
        '<input class="input" id="mUrl" value="'+esc(c.url)+'" placeholder="https://..." autocomplete="off"></div>'+
      '<div id="mPrev"></div>'+
      '<div class="grid2">'+
        '<div><label class="f">제목 <span class="dim">(선택)</span></label>'+
          '<input class="input" id="mTitle" value="'+esc(c.title)+'" placeholder="영상 제목"></div>'+
        '<div><label class="f">원작자 계정 <span class="dim">(DM 보낼 때 필요)</span></label>'+
          '<input class="input" id="mAuthor" value="'+esc(c.author)+'" placeholder="@계정명 또는 채널명"></div>'+
      '</div>'+
      '<div><label class="f">웃긴 포인트 한 줄 메모</label>'+
        '<textarea id="mNote" placeholder="예: 청소기 켜자마자 뒤로 1미터 점프 + 소파 뒤로 숨음">'+esc(c.note)+'</textarea></div>'+
      '<div class="grid2">'+
        '<div><label class="f">카테고리</label><select id="mCat">'+
          p.categories.map(function(x){ return '<option value="'+esc(x)+'"'+(c.category===x?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+
        '</select></div>'+
        '<div><label class="f">클립 길이(초) <span class="dim">· 랭킹 러닝타임 계산용</span></label>'+
          '<input class="input" id="mSec" type="number" min="0" max="120" value="'+(c.seconds||'')+'" placeholder="예: 8"></div>'+
      '</div>'+
      '<div class="grid2">'+
        '<div><label class="f">임팩트 점수</label><div class="star-input" id="mStars">'+
          [1,2,3,4,5].map(function(i){ return '<button type="button" data-s="'+i+'" class="'+(i<=c.score?'on':'')+'">★</button>'; }).join('')+
        '</div></div>'+
        '<div><label class="f">라이선스 상태</label><select id="mLic">'+
          LICENSES.map(function(L){ return '<option value="'+esc(L.v)+'"'+(c.license===L.v?' selected':'')+'>'+L.emo+' '+esc(L.v)+'</option>'; }).join('')+
        '</select></div>'+
      '</div>'+
      '<div class="tip" style="margin:0">⚖️ <b>저작권 안내</b> — 다른 사람의 영상은 원작자 허락 없이 쓸 수 없습니다. '+
        '원작자에게 DM을 보내 사용 허락을 받고 상태를 「DM 보냄」 → 「허락받음」으로 바꿔 주세요. '+
        '<b>허락받음 / CC·퍼블릭도메인 / 라이선스 구매</b> 상태만 랭킹 보드의 후보가 됩니다.</div>'+
    '</div>'+
    '<div class="foot">'+
      (clip?'<button class="btn danger" id="mDel">삭제</button>':'')+
      '<button class="btn" id="mCancel">취소</button>'+
      '<button class="btn primary" id="mSave">'+(clip?'저장':'등록')+'</button>'+
    '</div>'+
  '</div></div>';

  var root=$('#modalRoot'); root.innerHTML=html;
  var score=c.score;
  function prev(){
    var u=($('#mUrl').value||'').trim();
    var pl=detectPlatform(u); var th=autoThumb(u)||(clip?c.thumb:(prefill&&prefill.thumb)||'');
    $('#mPrev').innerHTML = u
      ? '<div class="row" style="align-items:center;gap:10px">'+platBadge(pl)+
        (th?'<div class="tn-ph">'+(PLATFORMS[pl]||PLATFORMS.etc).emo+'<img class="tn" src="'+esc(th)+'" alt="" onerror="this.remove()"></div>'
           :'<span class="dim" style="font-size:12px">썸네일 자동 표시는 YouTube만 지원합니다</span>')+
        '</div>' : '';
  }
  prev();
  $('#mUrl').addEventListener('input',prev);
  on('#mStars button','click',function(e){
    score=+e.currentTarget.getAttribute('data-s');
    $$('#mStars button').forEach(function(b){ b.classList.toggle('on', +b.getAttribute('data-s')<=score); });
  });
  function close(){ root.innerHTML=''; }
  $('#mx').addEventListener('click',close);
  $('#mCancel').addEventListener('click',close);
  $('#mbg').addEventListener('mousedown',function(e){ if(e.target.id==='mbg') close(); });
  if($('#mDel')) $('#mDel').addEventListener('click',function(){
    if(!confirm('이 클립을 삭제할까요?')) return;
    var pp=P(); pp.clips=pp.clips.filter(function(x){ return x.id!==clip.id; });
    ['1','2','3','4','5'].forEach(function(k){ if(pp.ranking[k]===clip.id) pp.ranking[k]=null; });
    close(); render(); toast('삭제했습니다','ok');
  });
  $('#mSave').addEventListener('click',function(){
    var url=($('#mUrl').value||'').trim();
    var note=($('#mNote').value||'').trim();
    if(!url && !note){ toast('URL 또는 메모 중 하나는 입력해야 합니다','err'); return; }
    var lic=$('#mLic').value;
    var data={
      url:url, platform:detectPlatform(url),
      title:($('#mTitle').value||'').trim(), author:($('#mAuthor').value||'').trim(),
      note:note, category:$('#mCat').value, score:score, license:lic,
      seconds:Math.max(0,Number($('#mSec').value)||0),
      thumb:autoThumb(url)||c.thumb||'', views:c.views==null?null:c.views
    };
    var pp=P();
    if(clip){
      var tgt=clipById(clip.id);
      var licChanged = tgt.license!==lic;
      Object.assign(tgt,data);
      if(licChanged) tgt.licenseAt=new Date().toISOString();
      toast('수정했습니다','ok');
    }else{
      data.id=uid(); data.createdAt=new Date().toISOString(); data.licenseAt=data.createdAt;
      pp.clips.push(data);
      toast('클립을 등록했습니다 (총 '+pp.clips.length+'개)','ok');
    }
    close(); render();
  });
  setTimeout(function(){ var f=$('#mUrl'); if(f&&!c.url) f.focus(); },50);
}

/* ============================================================
   5) 랭킹 보드
   ============================================================ */
function viewRank(v){
  var p=P();
  var cands=p.clips.filter(function(c){ return USABLE.indexOf(c.license)>-1; })
                   .sort(function(a,b){ return b.score-a.score; });

  if(cands.length===0){
    v.innerHTML = secTitle('랭킹 보드','사용 허락을 받은 클립만 5위→1위 슬롯에 배치합니다.')+
      emptyBox('🏆','아직 배치할 수 있는 클립이 없습니다',
        '랭킹 보드에는 <b>라이선스가 확보된 클립만</b> 후보로 올라옵니다.',
        ['클립 DB 탭에서 클립을 등록합니다.',
         '원작자에게 사용 허락 DM을 보내고 상태를 <b>「DM 보냄」</b>으로 바꿉니다.',
         '허락 답장을 받으면 <b>「허락받음」</b>으로 바꿉니다. (CC·퍼블릭도메인, 라이선스 구매도 후보가 됩니다)',
         '후보가 생기면 드래그하거나 탭해서 5위→1위 슬롯에 배치합니다.'],
        '<button class="btn primary" data-go="clips">🎞 클립 DB로 이동</button>');
    bindGo(v); return;
  }

  var slots=[5,4,3,2,1].map(function(r){
    var c=p.ranking[String(r)]?clipById(p.ranking[String(r)]):null;
    var inner = c
      ? '<div class="ttl">'+esc(c.title||c.note||c.url)+'</div>'+
        '<div class="meta">'+starsHTML(c.score)+platBadge(c.platform)+
          '<span class="badge b-gray">'+esc(c.category)+'</span>'+
          '<span class="dim">'+esc(c.author||'계정 미기재')+'</span></div>'+
        '<div class="guide">💡 '+esc(RANK_GUIDE[r])+'</div>'+
        '<div class="meta"><span class="dim">길이</span>'+
          '<input class="input sec" type="number" min="0" max="120" data-sec="'+c.id+'" value="'+(c.seconds||'')+'" placeholder="초">'+
          '<span class="dim">초</span>'+
          (c.url?'<a class="btn xs" href="'+esc(c.url)+'" target="_blank" rel="noopener" style="text-decoration:none">열기</a>':'')+
          '<button class="btn xs danger" data-clear="'+r+'">비우기</button></div>'
      : '<div class="ph">여기로 클립을 끌어다 놓거나, 오른쪽 후보를 탭한 뒤 이 칸을 탭하세요.</div>'+
        '<div class="guide">💡 '+esc(RANK_GUIDE[r])+'</div>';
    return '<div class="slot'+(c?' filled':'')+'" data-r="'+r+'" data-slot="'+r+'">'+
      '<div class="no">'+r+'<small>위</small></div><div class="inner">'+inner+'</div></div>';
  }).join('');

  var used=Object.keys(p.ranking).map(function(k){ return p.ranking[k]; });
  var candHTML=cands.map(function(c){
    var isUsed=used.indexOf(c.id)>-1;
    return '<div class="cand'+(isUsed?' used':'')+(ui.selCand===c.id?' sel':'')+'" draggable="true" data-cand="'+c.id+'">'+
      thumbHTML(c)+
      '<div class="ci"><div class="ct">'+esc(c.title||c.note||c.url)+'</div>'+
        '<div class="cm">'+starsHTML(c.score)+' · '+esc(c.category)+(isUsed?' · <b>배치됨</b>':'')+'</div></div>'+
    '</div>';
  }).join('');

  var total=totalRuntime(), n=rankFilled();
  var warn = n<5 ? {cls:'b-gray',  t:'슬롯 '+n+'/5 배치됨 — 5칸을 모두 채워 보세요'}
           : total<35 ? {cls:'b-yellow',t:'권장(35~50초)보다 짧습니다 — 클립을 조금 더 길게 쓰거나 인트로를 넣으세요'}
           : total>50 ? {cls:'b-red',   t:'권장(35~50초)보다 깁니다 — 각 클립을 더 짧게 잘라 보세요'}
                      : {cls:'b-green', t:'권장 러닝타임(35~50초) 안에 들어왔습니다 👍'};

  v.innerHTML = secTitle('랭킹 보드','5위부터 1위까지 배치합니다. 드래그 앤 드롭 또는 탭 두 번으로 배치돼요.',
      (n?'<button class="btn danger" id="rkReset">전체 비우기</button>':'')+
      '<button class="btn" id="rkAuto">✨ 점수순 자동 배치</button>')+
    '<div class="rank-layout">'+
      '<div>'+slots+'</div>'+
      '<div>'+
        '<div class="card"><h3>후보 클립 <span class="sub">'+cands.length+'개 · 라이선스 확보분</span></h3>'+
          (ui.selCand?'<div class="tip" style="margin-bottom:10px">👆 선택됨 — 배치할 슬롯을 탭하세요. <button class="btn xs" id="rkUnsel">선택 해제</button></div>':'')+
          '<div style="max-height:430px;overflow:auto">'+candHTML+'</div></div>'+
        '<div class="runtime-box">'+
          '<div class="dim" style="font-size:12px;font-weight:700">예상 총 러닝타임</div>'+
          '<div class="runtime-big">'+fmtSec(total)+'</div>'+
          '<div style="margin:8px 0"><span class="badge '+warn.cls+'">'+esc(warn.t)+'</span></div>'+
          '<div class="bar sm"><i style="width:'+Math.min(100,Math.round(total/50*100))+'%"></i></div>'+
          '<p class="dim" style="font-size:11.5px;margin:9px 0 0">쇼츠는 35~50초가 시청 유지율에 가장 유리합니다. '+
          '각 슬롯의 「초」 칸에 클립 길이를 넣으면 자동 합산됩니다.</p>'+
        '</div>'+
      '</div>'+
    '</div>';

  /* 드래그 앤 드롭 */
  on('[data-cand]','dragstart',function(e){
    var id=e.currentTarget.getAttribute('data-cand');
    e.dataTransfer.setData('text/plain',id); e.dataTransfer.effectAllowed='move';
  },v);
  on('[data-slot]','dragover',function(e){ e.preventDefault(); e.currentTarget.classList.add('over'); },v);
  on('[data-slot]','dragleave',function(e){ e.currentTarget.classList.remove('over'); },v);
  on('[data-slot]','drop',function(e){
    e.preventDefault(); e.currentTarget.classList.remove('over');
    place(e.dataTransfer.getData('text/plain'), e.currentTarget.getAttribute('data-slot'));
  },v);
  /* 탭 배치 (모바일) */
  on('[data-cand]','click',function(e){
    var id=e.currentTarget.getAttribute('data-cand');
    ui.selCand = (ui.selCand===id?null:id); render();
  },v);
  on('[data-slot]','click',function(e){
    if(!ui.selCand) return;
    if(e.target.closest('button')||e.target.closest('input')||e.target.closest('a')) return;
    place(ui.selCand, e.currentTarget.getAttribute('data-slot'));
  },v);
  on('#rkUnsel','click',function(){ ui.selCand=null; render(); },v);
  on('[data-clear]','click',function(e){
    P().ranking[e.currentTarget.getAttribute('data-clear')]=null; render();
  },v);
  on('[data-sec]','change',function(e){
    var c=clipById(e.currentTarget.getAttribute('data-sec'));
    if(c){ c.seconds=Math.max(0,Number(e.currentTarget.value)||0); render(); }
  },v);
  on('#rkReset','click',function(){
    if(!confirm('랭킹 배치를 모두 비울까요? (클립은 삭제되지 않습니다)')) return;
    P().ranking={'1':null,'2':null,'3':null,'4':null,'5':null}; ui.selCand=null; render();
  },v);
  on('#rkAuto','click',function(){
    var pp=P(); var top=cands.slice(0,5);
    pp.ranking={'1':null,'2':null,'3':null,'4':null,'5':null};
    top.forEach(function(c,i){ pp.ranking[String(i+1)]=c.id; });
    ui.selCand=null; render(); toast('임팩트 점수가 높은 순으로 1~'+top.length+'위를 채웠습니다','ok');
  },v);

  function place(clipId,slot){
    if(!clipId||!slot) return;
    var pp=P();
    ['1','2','3','4','5'].forEach(function(k){ if(pp.ranking[k]===clipId) pp.ranking[k]=null; });
    pp.ranking[slot]=clipId; ui.selCand=null; render();
    toast(slot+'위에 배치했습니다','ok');
  }
}

  on('#sSave','click',function(){

/* ============================================================
   내보내기 / 가져오기
   ============================================================ */
function download(filename,content,mime){
  var blob=new Blob([content],{type:mime||'application/octet-stream'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },500);
}
function stamp(){ var d=new Date();
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+
         '-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0'); }
/* 파일 이름은 ASCII만 사용합니다 — index.html 을 file:// 로 열었을 때 크롬이
   한글 파일명을 무시하고 확장자 없는 "download" 로 저장해 버리기 때문입니다.
   (파일 안의 한글 데이터는 그대로 유지됩니다) */
function safeName(s){
  var t=String(s||'').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^[-.]+|[-.]+$/g,'').slice(0,40);
  return t||'project';
}

function exportJson(){
  var out=JSON.parse(JSON.stringify(state)); out.apiKey='';  /* 키는 백업에 포함하지 않음 */
  out.exportedAt=new Date().toISOString(); out.app='ranking-shorts-source-manager';
  download('ranking-shorts-backup-'+stamp()+'.json', JSON.stringify(out,null,2),'application/json');
  toast('JSON 백업을 내보냈습니다 (API 키는 제외)','ok');
}
function exportCsv(){
  var p=P();
  if(!p.clips.length){ toast('내보낼 클립이 없습니다','err'); return; }
  var head=['번호','제목','URL','플랫폼','원작자','카테고리','임팩트점수','라이선스상태','길이(초)','웃긴포인트','조회수','랭킹','등록일'];
  function q(s){ return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'; }
  var rank={}; ['1','2','3','4','5'].forEach(function(k){ if(p.ranking[k]) rank[p.ranking[k]]=k+'위'; });
  var lines=[head.map(q).join(',')];
  p.clips.forEach(function(c,i){
    lines.push([i+1,c.title,c.url,(PLATFORMS[c.platform]||PLATFORMS.etc).name,c.author,c.category,
      c.score,c.license,c.seconds||'',c.note,(c.views==null?'':c.views),rank[c.id]||'',fmtDate(c.createdAt)].map(q).join(','));
  });
  download('clips-db-'+safeName(p.name)+'-'+stamp()+'.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8');
  toast('CSV '+p.clips.length+'행을 내보냈습니다','ok');
}
function importJson(e){
  var file=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!file) return;
  var fr=new FileReader();
  fr.onload=function(){
    var data;
    try{ data=JSON.parse(fr.result); }
    catch(err){ toast('JSON 파일을 읽을 수 없습니다','err'); return; }
    if(!data||!Array.isArray(data.projects)||!data.projects.length){ toast('올바른 백업 파일이 아닙니다','err'); return; }
    var n=data.projects.length;
    var replace=confirm('백업 파일에 프로젝트 '+n+'개가 들어 있습니다.\n\n[확인] 현재 데이터를 모두 지우고 덮어쓰기\n[취소] 기존 데이터는 두고 프로젝트만 추가하기');
    data.projects.forEach(normalizeProject);
    if(replace){
      var key=state.apiKey;
      state={version:1, apiKey:key, theme:state.theme, activeId:data.projects[0].id, projects:data.projects};
    }else{
      data.projects.forEach(function(p){
        if(state.projects.some(function(x){ return x.id===p.id; })){ p.id=uid(); p.name=p.name+' (가져옴)'; }
        state.projects.push(p);
      });
      state.activeId=data.projects[data.projects.length-1].id;
    }
    ui.tab='dash'; render();
    toast('프로젝트 '+n+'개를 가져왔습니다','ok');
  };
  fr.onerror=function(){ toast('파일 읽기에 실패했습니다','err'); };
  fr.readAsText(file);
}

/* ============================================================
   프로젝트 조작 · 초기화
   ============================================================ */
function newProject(){
  var nm=prompt('새 프로젝트 이름(영상 제목)을 입력하세요','예: Dog vs Vacuum');
  if(nm===null) return;
  nm=nm.trim(); if(!nm){ toast('이름을 입력하세요','err'); return; }
  var p=blankProject(nm);
  state.projects.push(p); state.activeId=p.id; ui.tab='keywords'; ui.selCand=null;
  render(); toast('프로젝트 「'+nm+'」을 만들었습니다','ok');
}
function deleteProject(){
  var p=P();
  if(state.projects.length<=1){ toast('마지막 프로젝트는 삭제할 수 없습니다','err'); return; }
  if(!confirm('프로젝트 「'+p.name+'」과 클립 '+p.clips.length+'개를 삭제할까요?\n되돌릴 수 없습니다.')) return;
  state.projects=state.projects.filter(function(x){ return x.id!==p.id; });
  state.activeId=state.projects[0].id; ui.selCand=null;
  render(); toast('삭제했습니다','ok');
}
function toggleTheme(){ state.theme = state.theme==='dark'?'light':'dark'; render(); }

  render();
});
